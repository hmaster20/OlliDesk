# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, deep_refactor]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Быстрый gate (секунды): висячие импорты, синтаксис, дубликаты.
  # Ловит NameError-класс багов до того, как поднимется pytest.
  # ---------------------------------------------------------------
  fast-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Undefined names / dead imports / syntax (fast)
        run: ruff check . --select F,E9
      - name: Syntax check (stdlib, ловит невалидный Python)
        run: python -m compileall -q agents core fs state tools ui

  # ---------------------------------------------------------------
  # Полный gate: ruff + pytest на двух ОС.
  # Windows проверяет CREATE_NO_WINDOW / powershell-ветки, Ubuntu — Linux-fallback.
  # ---------------------------------------------------------------
  test:
    needs: fast-check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Ruff (full)
        run: ruff check .
      - name: Pytest + coverage
        run: pytest -q --cov=agents --cov=core --cov=fs --cov=state --cov=tools --cov=ui --cov-report=xml
      - name: Upload coverage
        # только с одной ОС, чтобы не было дубля загрузки
        if: matrix.os == 'windows-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------
  # mypy — non-blocking. Отчёт сохраняется в артефакт для истории.
  # Станет blocking, когда счётчик ошибок упадёт до нуля (см. план).
  # ---------------------------------------------------------------
  mypy:
    needs: fast-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: mypy
        run: mypy core agents fs state tools 2>&1 | tee mypy-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mypy-report
          path: mypy-report.txt
          retention-days: 30state --cov=tools --cov=ui --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
